  geography:
    title: "Votes by district"
    subtitle: "How did members of parliament vote in different parts of the country — based on their own electoral district, not party."
    interpretation_note: "The map shows how sitting members of parliament voted, grouped by their electoral district — not how voters in that region voted in an election. Members almost always vote along party lines, so the color mostly reflects which parties hold seats in that district, not an independent regional stance. Smaller districts (few seats, like Gotland) also produce noisier numbers, since a single member's vote carries more weight there."
    vote_context: "Showing how members voted by district on %{beteckning} (%{avser})."
