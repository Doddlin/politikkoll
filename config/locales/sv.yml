    subtitle: "Hur röstade riksdagsledamöterna i olika delar av landet — baserat på deras egen valkrets, inte partitillhörighet."
    interpretation_note: "Kartan visar hur sittande riksdagsledamöter röstade, grupperat efter valkrets — inte hur väljarna i regionen röstat i ett val. Ledamöter röstar nästan alltid i linje med sitt parti, så färgen speglar oftast vilka partier som har mandat i valkretsen, inte en egen regional hållning. Mindre valkretsar (få mandat, som Gotland) ger dessutom mer skiftande siffror eftersom en enskild ledamots röst väger tyngre där."
